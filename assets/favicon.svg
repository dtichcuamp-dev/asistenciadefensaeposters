<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088EA"/>
      <stop offset="100%" stop-color="#005A9C"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4D4"/>
      <stop offset="100%" stop-color="#008C99"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002D54" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular background badge with deep institutional blue -->
  <rect width="512" height="512" rx="128" fill="#004C87"/>
  
  <!-- Subtle circular accent ring -->
  <circle cx="256" cy="256" r="210" stroke="#00A8B5" stroke-width="6" fill="none" opacity="0.4"/>

  <!-- Main emblem CP with cross -->
  <g filter="url(#shadow)">
    <!-- Letter C in Surgical Blue -->
    <path d="M 230 110 A 146 146 0 1 0 230 402 L 230 336 A 80 80 0 1 1 230 176 Z" fill="url(#blueGrad)"/>

    <!-- Letter P in Medical Turquoise/Teal -->
    <path d="M 226 210 L 320 210 A 65 65 0 0 1 320 340 L 256 340 L 256 420 L 196 420 L 196 210 Z" fill="url(#tealGrad)"/>
    <path d="M 256 265 L 305 265 A 20 20 0 0 0 305 285 L 256 285 Z" fill="#004C87" opacity="0.3"/>

    <!-- White Medical Cross -->
    <g transform="translate(196, 215)">
      <rect x="25" y="0" width="22" height="72" rx="5" fill="#FFFFFF"/>
      <rect x="0" y="25" width="72" height="22" rx="5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
